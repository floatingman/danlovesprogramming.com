name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['deploy/**']

permissions:
  contents: write
  packages: write

jobs:
  build-push-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: 'ghcr.io/${{ github.repository }}:sha-${{ github.sha }}'
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
      - name: Bump image tag in Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i "s/newTag: .*/newTag: sha-${GITHUB_SHA}/" deploy/clusters/homelab/kustomization.yaml
          git add deploy/clusters/homelab/kustomization.yaml
          git commit -m "ci: bump image to sha-${GITHUB_SHA::7} [skip ci]"
          git push
